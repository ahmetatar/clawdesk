; clawd examples — 01 Hello World
; Draws "Hello, clawd!" with TFT_eSPI on a CYD / ESP32-2432S028R.
; The pins are for a typical CYD revision; if the screen comes up white, mirrored
; or with wrong colours, check the TFT_* flags and the TFT_RGB_ORDER /
; TFT_INVERSION_* lines below first.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI@^2.5.43

build_flags =
  ; --- tell TFT_eSPI to skip its setup file and take the pins from here ---
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1

  ; --- display resolution ---
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320

  ; --- CYD display SPI pins ---
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH

  ; --- colour order / inversion (try these if the colours look wrong) ---
  ; -D TFT_RGB_ORDER=TFT_BGR
  ; -D TFT_INVERSION_ON=1

  ; --- fonts ---
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1

  ; --- SPI speed ---
  -D SPI_FREQUENCY=55000000
